name: Update Genshin data

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Ambr HTTP responses
        uses: actions/cache@v4
        with:
          path: .cache/ambr
          key: ambr-cache-${{ github.run_id }}
          restore-keys: |
            ambr-cache-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run data sync
        run: python scripts/update_data.py

      - name: Commit changes if any
        id: commit
        run: |
          git config user.name "genshin-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/data/characters.js assets/data/weapons.js assets/data/character-profiles/ assets/data/weapon-profiles/ assets/data/shared-assets/ assets/data/curves/ scripts/.data-version.json
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync characters/weapons/profiles from Project Ambr"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy if data changed
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
